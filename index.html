<title>Cabana Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: één kolom, sticky kop met profielkeuze, 2x2 grote strandtegels, schermen schuiven eronder in. */
:root {
  --bg: #eef6f4;          /* zeeschuim */
  --surface: #ffffff;
  --surface-2: #e2efec;
  --ink: #0f3440;         /* diepzee */
  --muted: #58767e;
  --line: #cfe1dd;
  --lagoon: #0b8f9c;
  --sun: #f7a933;
  --coral: #f2644d;
  --palm: #3f8f5a;
  --deep: #1d4e89;
  --sand: #f3e3c3;
  --ok: #2f8a4e;
  --danger: #c43d2b;
  --me: var(--lagoon);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --font-body: "Figtree", -apple-system, "Helvetica Neue", system-ui, sans-serif;
  --r: 22px;
  --tap: 56px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a1d24; --surface: #11303a; --surface-2: #173c47; --ink: #e4f3f1; --muted: #8fb0b5;
  --line: #24505b; --lagoon: #2bb7c3; --sun: #f7b24a; --coral: #f47a64; --palm: #5db877; --deep: #4f86c9;
  --sand: #3a3322; --ok: #5cc27d; --danger: #f07360; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0a1d24; --surface: #11303a; --surface-2: #173c47; --ink: #e4f3f1; --muted: #8fb0b5;
  --line: #24505b; --lagoon: #2bb7c3; --sun: #f7b24a; --coral: #f47a64; --palm: #5db877; --deep: #4f86c9;
  --sand: #3a3322; --ok: #5cc27d; --danger: #f07360; color-scheme: dark;
}
body.p-paula { --me: var(--coral); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font-body); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--surface) 45%, transparent);
  backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid rgb(255 255 255 / .45);
  box-shadow: 0 8px 24px -16px rgb(20 30 50 / .35);
}
.top-in { max-width: 720px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.brand svg { flex: none; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; white-space: nowrap; }
.brand small { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; background: color-mix(in srgb, var(--surface-2) 70%, transparent); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: none; padding: 8px 14px; min-height: 44px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgb(0 0 0 / .12); }
.seg button[data-p="patrick"][aria-pressed="true"] { color: var(--lagoon); }
.seg button[data-p="paula"][aria-pressed="true"] { color: var(--coral); }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }

main { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 18px; }

.hello { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.hello h1 { font-size: 30px; font-weight: 800; }
.hello h1 span { color: var(--me); }
.hello p { margin: 2px 0 0; color: var(--ink); opacity: .75; font-size: 15px; }

/* ---------- Strand-achtergrond: zonsondergang, zee, zand (vast achter alles) ---------- */
html { background: #ffd9bd; }
body { background: transparent; min-height: 100vh; }
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 80% 13%, #fff6cf 0 5.5%, rgb(255 214 140 / .85) 9%, rgb(255 190 120 / 0) 26%),
    radial-gradient(60% 40% at 5% 30%, rgb(255 120 110 / .55), transparent 70%),
    radial-gradient(55% 35% at 100% 62%, rgb(40 200 205 / .55), transparent 70%),
    radial-gradient(70% 30% at 20% 95%, rgb(255 226 170 / .9), transparent 70%),
    linear-gradient(180deg, #ffdcbf 0%, #ffc3aa 20%, #ffae9e 34%, #9fdcd6 50%, #4cbcc6 64%, #7fd0c9 74%, #f3dcb4 86%, #f8e8ca 100%);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body::before { background:
    radial-gradient(circle at 80% 13%, #ffe2b0 0 4%, rgb(255 170 120 / .5) 8%, transparent 24%),
    radial-gradient(60% 40% at 5% 30%, rgb(190 70 110 / .45), transparent 70%),
    radial-gradient(55% 35% at 100% 62%, rgb(20 150 165 / .5), transparent 70%),
    linear-gradient(180deg, #221c42 0%, #43295a 22%, #7a3a5c 34%, #10485a 52%, #0b3440 70%, #1c2a2c 88%, #141d1f 100%); }
  :root:not([data-theme="light"]) { background: #221c42; } }
:root[data-theme="dark"] body::before { background:
    radial-gradient(circle at 80% 13%, #ffe2b0 0 4%, rgb(255 170 120 / .5) 8%, transparent 24%),
    radial-gradient(60% 40% at 5% 30%, rgb(190 70 110 / .45), transparent 70%),
    radial-gradient(55% 35% at 100% 62%, rgb(20 150 165 / .5), transparent 70%),
    linear-gradient(180deg, #221c42 0%, #43295a 22%, #7a3a5c 34%, #10485a 52%, #0b3440 70%, #1c2a2c 88%, #141d1f 100%); }

/* Strandfoto als achtergrond (keuze onder Data & export); de getekende zonsondergang blijft de andere optie */
:root body.bg-photo::before { background:
    linear-gradient(180deg, rgb(255 255 255 / 0) 0%, rgb(255 255 255 / .12) 45%, rgb(255 244 228 / .38) 100%),
    url("img/beach.jpg") center 42% / cover no-repeat; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.bg-photo::before { background:
    linear-gradient(180deg, rgb(8 22 40 / .55), rgb(6 18 30 / .68)),
    url("img/beach.jpg") center 42% / cover no-repeat; } }
:root[data-theme="dark"] body.bg-photo::before { background: linear-gradient(180deg, rgb(8 22 40 / .55), rgb(6 18 30 / .68)), url("img/beach.jpg") center 42% / cover no-repeat; }
body.bg-photo .hello h1, body.bg-photo .hello p, body.bg-photo .head h1 { text-shadow: 0 1px 14px rgb(255 255 255 / .75); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.bg-photo :is(.hello h1, .hello p, .head h1) { text-shadow: 0 1px 12px rgb(0 0 0 / .55); } }
:root[data-theme="dark"] body.bg-photo :is(.hello h1, .hello p, .head h1) { text-shadow: 0 1px 12px rgb(0 0 0 / .55); }

/* Bewegende golfjes over de strandfoto: een schuimrand die aanrolt op het zand en weer wegtrekt */
body.bg-photo { --surf: .8; }
body.bg-photo::after {
  content: ""; position: fixed; left: -40%; width: 180%; top: 67vh; height: 16vh; z-index: -1; pointer-events: none; opacity: 0;
  background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 60%22 preserveAspectRatio=%22none%22%3E%3Cdefs%3E%3ClinearGradient id=%22f%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23fff%22 stop-opacity=%22.95%22/%3E%3Cstop offset=%22.35%22 stop-color=%22%23fff%22 stop-opacity=%22.45%22/%3E%3Cstop offset=%221%22 stop-color=%22%23fff%22 stop-opacity=%220%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d=%22M0 22 Q25 10 50 20 T100 20 T150 18 T200 21 T250 19 T300 20 T350 18 T400 22 V60 H0Z%22 fill=%22url%28%23f%29%22/%3E%3Cpath d=%22M0 22 Q25 10 50 20 T100 20 T150 18 T200 21 T250 19 T300 20 T350 18 T400 22%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222.5%22 stroke-opacity=%22.9%22/%3E%3C/svg%3E") repeat-x 0 0 / 420px 100%, url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 60%22 preserveAspectRatio=%22none%22%3E%3Cdefs%3E%3ClinearGradient id=%22f%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23fff%22 stop-opacity=%22.95%22/%3E%3Cstop offset=%22.35%22 stop-color=%22%23fff%22 stop-opacity=%22.45%22/%3E%3Cstop offset=%221%22 stop-color=%22%23fff%22 stop-opacity=%220%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d=%22M0 22 Q25 10 50 20 T100 20 T150 18 T200 21 T250 19 T300 20 T350 18 T400 22 V60 H0Z%22 fill=%22url%28%23f%29%22/%3E%3Cpath d=%22M0 22 Q25 10 50 20 T100 20 T150 18 T200 21 T250 19 T300 20 T350 18 T400 22%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222.5%22 stroke-opacity=%22.9%22/%3E%3C/svg%3E") repeat-x 190px 38% / 340px 70%;
  animation: surf 7s ease-in-out infinite; will-change: transform, opacity;
}
@keyframes surf {
  0% { transform: translate3d(0, 4vh, 0) scaleY(.7); opacity: 0; }
  30% { opacity: var(--surf); }
  55% { transform: translate3d(-70px, -1.5vh, 0) scaleY(1); opacity: calc(var(--surf) * .8); }
  100% { transform: translate3d(-140px, 5vh, 0) scaleY(.7); opacity: 0; }
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.bg-photo { --surf: .35; } }
:root[data-theme="dark"] body.bg-photo { --surf: .35; }
/* golf onderin elke tegel deint mee */
.tile::after { animation: tilewave 5.5s ease-in-out infinite; }
.tiles .tile:nth-child(2)::after { animation-delay: -1.2s; }
.tiles .tile:nth-child(3)::after { animation-delay: -2.6s; }
.tiles .tile:nth-child(4)::after { animation-delay: -3.8s; }
.tiles .tile:nth-child(5)::after { animation-delay: -.6s; }
@keyframes tilewave { 0%, 100% { transform: translateX(-4%) scaleY(1); } 50% { transform: translateX(4%) scaleY(1.14); } }
@media (prefers-reduced-motion: reduce) { body.bg-photo::after, .tile::after { animation: none; } }

/* ---------- Liquid glass tegels ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile {
  --tint: 242 100 77; --tint2: 247 169 51; --top: #fff3c4; --acc: #ffd166;
  position: relative; overflow: hidden; isolation: isolate;
  border: 1px solid rgb(255 255 255 / .6); border-radius: 28px;
  min-height: 272px; padding: 14px 14px 16px; text-align: left; color: #fff;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
  background:
    linear-gradient(160deg, rgb(255 255 255 / .38), rgb(255 255 255 / .04) 42%),
    linear-gradient(155deg, rgb(var(--tint) / .78), rgb(var(--tint2) / .55));
  -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow:
    inset 0 1.5px 0 rgb(255 255 255 / .75),
    inset 0 -1px 0 rgb(255 255 255 / .25),
    inset 0 -18px 30px -18px rgb(255 255 255 / .35),
    0 22px 40px -18px rgb(var(--tint) / .85),
    0 6px 14px -6px rgb(20 30 50 / .3);
  transition: transform .28s cubic-bezier(.2, .9, .3, 1.35), box-shadow .2s ease, filter .2s ease;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.tile::before { /* glansrand: licht dat over de bovenkant van het glas valt */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
  background: linear-gradient(115deg, rgb(255 255 255 / .55) 0%, rgb(255 255 255 / 0) 22%, rgb(255 255 255 / 0) 70%, rgb(255 255 255 / .18) 100%);
  mix-blend-mode: soft-light;
}
.tile::after { /* golf onderaan: het strand-accent */
  content: ""; position: absolute; left: -15%; right: -15%; bottom: -44px; height: 96px; border-radius: 50%; z-index: -1;
  background: rgb(255 255 255 / .16); pointer-events: none;
}
.tile .art { position: absolute; inset: 36px 0 auto; height: 132px; display: block; z-index: -1; pointer-events: none;
  filter: drop-shadow(0 8px 10px rgb(0 0 0 / .18)); transition: transform .3s cubic-bezier(.2, .9, .3, 1.4); }
.tile .art::before { content: ""; position: absolute; left: 50%; top: 50%; width: 118px; height: 118px; translate: -50% -50%; border-radius: 50%;
  background: radial-gradient(circle, rgb(255 255 255 / .38), rgb(255 255 255 / 0) 68%); }
.tile .ill { position: relative; width: 100%; height: 100%; display: block; }
.tile .tt { display: block; font-family: var(--font-display); line-height: 1.05; font-size: 20px; font-weight: 800; letter-spacing: -.01em; text-shadow: 0 1px 12px rgb(0 0 0 / .28); }
.tile .ts { display: block; margin: 3px 0 0; font-size: 12.5px; line-height: 1.3; font-weight: 500; opacity: .95; text-shadow: 0 1px 8px rgb(0 0 0 / .3); }
.tile .num { position: absolute; top: 12px; left: 12px; z-index: 3; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 4px 10px; border-radius: 999px; background: rgb(255 255 255 / .24); border: 1px solid rgb(255 255 255 / .45);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.tile .ripple { position: absolute; z-index: 1; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgb(255 255 255 / .75), rgb(255 255 255 / .25) 45%, rgb(255 255 255 / 0) 70%);
  animation: ripple .6s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes ripple { from { transform: scale(1); opacity: 1; } to { transform: scale(26); opacity: 0; } }
.tile:active, .tile.pressed {
  transform: scale(.95) translateY(2px);
  filter: brightness(1.08) saturate(1.1);
  border-color: rgb(255 255 255 / .95);
  box-shadow:
    inset 0 1.5px 0 rgb(255 255 255 / .9),
    inset 0 0 0 2px rgb(255 255 255 / .55),
    inset 0 -18px 30px -12px rgb(255 255 255 / .5),
    0 8px 18px -10px rgb(var(--tint) / .9),
    0 0 0 5px rgb(var(--tint) / .28);
  transition-duration: .08s;
}
.tile:active .art, .tile.pressed .art { transform: translateY(-5px) scale(1.06); transition-duration: .12s; }
.t-cardio { --tint: 242 94 70; --tint2: 250 170 55; --top: #fff3c4; }
.t-machine { --tint: 8 150 165; --tint2: 20 105 150; --top: #ffd166; }
.t-free { --tint: 38 82 160; --tint2: 105 70 170; --top: #ff9270; }
.t-goals { --tint: 44 150 100; --tint2: 30 150 150; --top: #ffd6e7; }

.card { background: color-mix(in srgb, var(--surface) 80%, transparent); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); box-shadow: inset 0 1px 0 rgb(255 255 255 / .5), 0 12px 30px -18px rgb(20 30 50 / .4); border: 1px solid color-mix(in srgb, #fff 55%, var(--line)); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { font-size: 18px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.back { align-self: flex-start; border: 0; background: none; color: var(--me); font-weight: 700; padding: 8px 0; min-height: 44px; display: flex; align-items: center; gap: 4px; }
.head h1 { font-size: 28px; font-weight: 800; }
.head p { margin: 4px 0 0; color: var(--muted); }

.list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.item {
  min-height: 84px; border-radius: 18px; border: 1px solid color-mix(in srgb, #fff 55%, var(--line)); background: color-mix(in srgb, var(--surface) 78%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgb(255 255 255 / .5), 0 8px 20px -14px rgb(20 30 50 / .4);
  transition: transform .2s cubic-bezier(.2, .9, .3, 1.35);
  padding: 12px 14px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
}
.item b { font-size: 16px; line-height: 1.2; }
.item span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.item.has-img { padding-top: 0; overflow: hidden; }
.item .thumb { max-width: none; width: calc(100% + 28px); margin: 0 -14px 6px; height: 96px; object-fit: cover; object-position: center 30%; display: block; }
.item .nl { font-size: 12px; }
.plate { padding: 12px; }
.plate summary { display: flex; gap: 12px; align-items: center; cursor: pointer; list-style: none; min-height: 56px; }
.plate summary::-webkit-details-marker { display: none; }
.plate summary > img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; flex: none; }
.plate summary > span { display: flex; flex-direction: column; min-width: 0; }
.plate summary > span::after { content: "Tik voor foto en stappen"; font-size: 12px; color: var(--me); font-weight: 700; }
.plate[open] summary > span::after { content: "Tik om te sluiten"; }
.plate .plate-big { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 14px; background: #000; }
.plate ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.item:active { transform: scale(.97); }
.item.add { border-style: dashed; background: color-mix(in srgb, var(--surface) 35%, transparent); color: var(--muted); justify-content: center; align-items: center; text-align: center; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
input.i, select.i, textarea.i {
  width: 100%; min-height: var(--tap); border-radius: 14px; border: 1px solid var(--line);
  background: var(--bg); padding: 12px 14px; font-size: 18px; font-weight: 500; color: var(--ink);
}
textarea.i { min-height: 80px; resize: vertical; font-size: 16px; }
input.i::placeholder, textarea.i::placeholder { color: var(--muted); opacity: .7; }

.btn { min-height: var(--tap); border-radius: 16px; border: 0; padding: 0 20px; font-weight: 700; font-size: 18px; background: var(--surface-2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--me); color: #fff; }
.btn.big { min-height: 68px; font-size: 20px; width: 100%; border-radius: 20px; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
.btn:active { transform: scale(.98); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 48px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--me); border-color: var(--me); color: #fff; }

/* Draaiknop: iOS-achtige scrollwielen met snap */
.wheels { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 10px; }
.wheelbox { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 0; }
.wheelbox > span { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.wheel { position: relative; height: 168px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.wheel::before { content: ""; position: absolute; left: 6px; right: 6px; top: 60px; height: 48px; border-radius: 12px; background: color-mix(in srgb, var(--me) 16%, transparent); pointer-events: none; }
.wheel::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(var(--bg), transparent 34%, transparent 66%, var(--bg)); }
.wheel-list { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; padding-block: 60px; }
.wheel-list::-webkit-scrollbar { display: none; }
.wheel-list div { height: 48px; line-height: 48px; text-align: center; scroll-snap-align: center; font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.wheel-list div.on { color: var(--ink); font-size: 28px; font-weight: 800; }
.step { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.summary small { display: block; font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted); }
.hint { background: var(--sand); border-radius: 14px; padding: 10px 14px; font-size: 15px; }

.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.hist { display: flex; flex-direction: column; }
.hist > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.hist > div:first-child { border-top: 0; }
.hist .l { min-width: 0; }
.hist .l b { display: block; }
.hist .l span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.hist .x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); flex: none; }
.empty { color: var(--muted); font-size: 15px; margin: 0; }

.photo { border: 2px dashed var(--line); border-radius: 18px; min-height: 150px; display: grid; place-items: center; text-align: center; padding: 16px; background: var(--bg); position: relative; overflow: hidden; }
.photo img { max-width: 100%; max-height: 260px; border-radius: 12px; display: block; }
.photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--sand); color: var(--ink); letter-spacing: .04em; }

legend { font-weight: 700; padding: 0 6px; display: flex; align-items: center; gap: 6px; }

.timer { font-family: var(--font-display); font-weight: 800; font-size: clamp(88px, 30vw, 150px); line-height: 1; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }

.stats div { background: var(--bg); border-radius: 14px; padding: 10px 4px; }

.stats span { font-size: 12px; color: var(--muted); }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stepc { border: 2px solid var(--line); border-radius: 18px; background: var(--bg); padding: 12px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; min-height: 96px; justify-content: center; }
.stepc b { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.stepc span { font-size: 12px; color: var(--muted); }
.stepc[aria-pressed="true"] { border-color: var(--me); background: color-mix(in srgb, var(--me) 12%, var(--surface)); }

pre.csv { margin: 0; max-height: 220px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 12px; line-height: 1.5; white-space: pre; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 14px 22px; border-radius: 999px; font-weight: 700; transition: .2s ease; z-index: 50; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }

/* ---------- Glas door de hele app: knoppen, velden, draaiknoppen, timers ---------- */
:root {
  --glass: color-mix(in srgb, var(--surface) 62%, transparent);
  --glass-field: color-mix(in srgb, var(--surface) 50%, transparent);
  --glass-edge: rgb(255 255 255 / .6);
  --glass-hi: rgb(255 255 255 / .7);
  --glass-blur: blur(20px) saturate(170%);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --glass: color-mix(in srgb, var(--surface) 58%, transparent); --glass-field: rgb(255 255 255 / .07); --glass-edge: rgb(255 255 255 / .16); --glass-hi: rgb(255 255 255 / .14); } }
:root[data-theme="dark"] { --glass: color-mix(in srgb, var(--surface) 58%, transparent); --glass-field: rgb(255 255 255 / .07); --glass-edge: rgb(255 255 255 / .16); --glass-hi: rgb(255 255 255 / .14); }

.card { background: var(--glass); border-color: var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), 0 14px 32px -18px rgb(20 30 50 / .45); }
.item { background: var(--glass); border-color: var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), 0 8px 20px -14px rgb(20 30 50 / .4); }
.top { border-bottom-color: var(--glass-edge); }

/* velden en kleine vlakken: helder glas in het kaartglas */
input.i, select.i, textarea.i, .chip, .wheel, .stats div, .stepc, .photo, pre.csv, .step button, .hist .x, .iconbtn {
  background: var(--glass-field); border-color: var(--glass-edge);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 2px rgb(0 0 0 / .04);
}
input.i:focus, select.i:focus, textarea.i:focus { outline: none; border-color: var(--me); box-shadow: inset 0 1px 0 var(--glass-hi), 0 0 0 4px color-mix(in srgb, var(--me) 22%, transparent); }
.photo { border-style: dashed; }
.hint { background: color-mix(in srgb, var(--sand) 62%, transparent); border: 1px solid var(--glass-edge); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: inset 0 1px 0 var(--glass-hi); }
.badge { background: color-mix(in srgb, var(--sand) 70%, transparent); border: 1px solid var(--glass-edge); }
fieldset { border-color: var(--glass-edge); background: rgb(255 255 255 / .06); }
.hist > div { border-top-color: color-mix(in srgb, var(--line) 60%, transparent); }

/* draaiknop: vervagen met een masker, zodat het glas eronder zichtbaar blijft */
.wheel::after { display: none; }
.wheel-list { -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); }
.wheel::before { background: color-mix(in srgb, var(--me) 20%, rgb(255 255 255 / .25)); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi); }

/* knoppen: gekleurd glas met glansrand */
.btn, .chip, .stepc, .step button, .hist .x, .iconbtn, .seg button {
  transition: transform .22s cubic-bezier(.2, .9, .3, 1.35), box-shadow .15s ease, filter .15s ease;
}
.btn {
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 8px 18px -12px rgb(20 30 50 / .45);
}
.btn.primary, .chip[aria-pressed="true"] {
  background:
    linear-gradient(170deg, rgb(255 255 255 / .38), rgb(255 255 255 / 0) 55%),
    color-mix(in srgb, var(--me) 86%, transparent);
  border-color: rgb(255 255 255 / .55); color: #fff; text-shadow: 0 1px 6px rgb(0 0 0 / .2);
  box-shadow: inset 0 1.5px 0 rgb(255 255 255 / .6), inset 0 -10px 18px -10px rgb(255 255 255 / .35), 0 12px 24px -12px color-mix(in srgb, var(--me) 90%, transparent);
}
.btn.ghost { background: var(--glass-field); }
.btn.danger { background: color-mix(in srgb, var(--danger) 10%, var(--glass-field)); border-color: color-mix(in srgb, var(--danger) 70%, transparent); }
.stepc[aria-pressed="true"] { background: color-mix(in srgb, var(--me) 18%, var(--glass-field)); border-color: var(--me); box-shadow: inset 0 1px 0 var(--glass-hi), 0 0 0 4px color-mix(in srgb, var(--me) 16%, transparent); }
.seg { border: 1px solid var(--glass-edge); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: inset 0 1px 3px rgb(0 0 0 / .06); }
.seg button[aria-pressed="true"] { background: var(--glass); box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 8px rgb(0 0 0 / .12); }
.btn:active, .chip:active, .stepc:active, .step button:active, .hist .x:active, .iconbtn:active, .seg button:active {
  transform: scale(.95); filter: brightness(1.08); transition-duration: .07s;
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 0 0 2px rgb(255 255 255 / .5), 0 0 0 4px color-mix(in srgb, var(--me) 22%, transparent);
}


/* timer en melding */
.timer { text-shadow: 0 2px 18px rgb(255 255 255 / .45); }
.timer.run { text-shadow: 0 0 28px color-mix(in srgb, var(--me) 45%, transparent); }

  -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); box-shadow: inset 0 1px 0 rgb(255 255 255 / .25), 0 14px 30px -10px rgb(0 0 0 / .45); }

.sent { margin: 0; font-size: 14px; font-weight: 700; color: var(--palm); }

/* ---------- Fase 3: toestel-foto's, lightbox, 5e tegel en trainingsschema's ---------- */
.tile.wide { grid-column: 1 / -1; min-height: 200px; padding: 16px 18px 18px; }

/* Met de strandfoto: tegels lichter getint en minder wazig, zodat het strand door het glas heen loopt */
body.bg-photo .tile {

/* grote toestelfoto meteen bovenaan, met je eigen instellingen erop */
.hero { padding: 0; overflow: hidden; gap: 0; }

.glasspill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff;
  background: rgb(255 255 255 / .18); border: 1px solid rgb(255 255 255 / .45); -webkit-backdrop-filter: blur(12px) saturate(170%); backdrop-filter: blur(12px) saturate(170%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .45); text-shadow: 0 1px 4px rgb(0 0 0 / .35); }
.hero-img .zoomtag { position: absolute; top: 10px; right: 10px; z-index: 1; }
.hero-set { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; }
.hero-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.hero-body ol, .lightbox ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }

.lightbox { position: fixed; inset: 0; z-index: 60; overflow-y: auto; overscroll-behavior: contain; color: #fff;
  background: rgb(6 16 22 / .8); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); animation: lbIn .22s ease; }
.lightbox .lb-in { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.lightbox .lb-close { align-self: flex-end; width: 48px; height: 48px; border-radius: 50%; font-size: 26px; line-height: 1; color: #fff;
  background: rgb(255 255 255 / .16); border: 1px solid rgb(255 255 255 / .4); box-shadow: inset 0 1px 0 rgb(255 255 255 / .4); }
.lightbox img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 16px; background: #000; }
.lightbox h2 { font-size: 24px; }
.lightbox .muted { color: rgb(255 255 255 / .72); }
.lightbox .pills { display: flex; flex-wrap: wrap; gap: 6px; }
@keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }

/* schema's */
.progs { display: flex; flex-direction: column; gap: 12px; }
.prog { min-height: 96px; }
.prog b { font-family: var(--font-display); font-size: 21px; }
.prog.on { border-color: var(--me); box-shadow: inset 0 1px 0 var(--glass-hi), 0 0 0 3px color-mix(in srgb, var(--me) 28%, transparent), 0 8px 20px -14px rgb(20 30 50 / .4); }
.prog .thumbs { display: flex; gap: 4px; margin-top: 4px; }

.exrow { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 14px 0 12px; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.exrow:first-of-type { border-top: 0; padding-top: 4px; }

.exrow .ph span { position: absolute; right: 4px; bottom: 4px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px;
  background: rgb(0 0 0 / .45); color: #fff; border: 1px solid rgb(255 255 255 / .5); }

.setline { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 50px; font-variant-numeric: tabular-nums; }

.setline small { color: var(--muted); font-size: 13px; display: block; }
.logbtn { flex: none; min-height: 44px; min-width: 84px; padding: 0 16px; border-radius: 999px; font-weight: 700; color: #fff; border: 1px solid rgb(255 255 255 / .55);
  background: linear-gradient(170deg, rgb(255 255 255 / .38), rgb(255 255 255 / 0) 55%), color-mix(in srgb, var(--me) 86%, transparent);
  box-shadow: inset 0 1.5px 0 rgb(255 255 255 / .6), 0 8px 16px -10px color-mix(in srgb, var(--me) 90%, transparent);
  transition: transform .22s cubic-bezier(.2, .9, .3, 1.35); }
.logbtn:active { transform: scale(.94); }

.wave th { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; border-top: 0; }

@media (min-width: 640px) {

/* Bewegende figuren: elke tegel een eigen korte lus die bij de sport past */

.t-machine .a-cable { animation: cable 2.4s ease-in-out infinite; transform-origin: 110px 20px; }

@keyframes press { 0%, 100% { transform: scaleY(1); } 30%, 45% { transform: scaleY(.72); } 60% { transform: scaleY(1); } }

@keyframes twinkle { 0%, 60%, 100% { opacity: 1; } 30%, 45% { opacity: 0; } }
.t-goals .ill .fig { animation: sway 3.6s ease-in-out infinite; transform-origin: 100px 172px; }

@media (min-width: 640px) {

function migrate(s) {
  if (s.v >= 2) return s;
  for (const p in s.data) {
    const d = s.data[p];
    const own = (d.machines || []).filter(m => !m.key && !DEFAULT_MACHINES.includes(m.name))

/* ---------- Draaiknop (wheel picker) ---------- */
function range(from, to, step) { const a = []; for (let v = from; v <= to + 1e-9; v += step) a.push(Math.round(v * 100) / 100); return a; }
const SETS = range(1, 8, 1), REPS = range(1, 40, 1), WEIGHTS = range(0, 250, 1.25);
function wheelHTML(id, label, values, cur, fmt = String, jump = 1) {
  const idx = nearestIdx(values, cur);
  return `<div class="wheelbox"><span>${label}</span>
    <div class="wheel"><div class="wheel-list" id="${id}" data-idx="${idx}" tabindex="0" role="spinbutton" aria-label="${label}" aria-valuenow="${values[idx]}">
      ${values.map((v, i) => `<div class="${i === idx ? "on" : ""}">${fmt(v)}</div>`).join("")}
    </div></div>
    <div class="step"><button type="button" data-w="${id}" data-d="${-jump}" aria-label="${label} omlaag">−</button><button type="button" data-w="${id}" data-d="${jump}" aria-label="${label} omhoog">+</button></div>
  </div>`;
}
function nearestIdx(values, v) { let b = 0; values.forEach((x, i) => { if (Math.abs(x - v) < Math.abs(values[b] - v)) b = i; }); return b; }
const ITEM = 48;
function initWheel(id, values, onChange) {
  const el = document.getElementById(id); if (!el) return null;
  let idx = +el.dataset.idx, t;
  const mark = (i) => { [...el.children].forEach((c, k) => c.classList.toggle("on", k === i)); el.setAttribute("aria-valuenow", values[i]); };
  const set = (i, smooth) => {
    i = Math.max(0, Math.min(values.length - 1, i));
    if (i !== idx) buzz();
    idx = i; mark(i); onChange(values[i]);
    el.scrollTo({ top: i * ITEM, behavior: smooth ? "smooth" : "auto" });
  };
  // Beginstand zetten zonder snap, pas daarna scroll-events verwerken.
  let ready = false;
  el.style.scrollSnapType = "none"; el.scrollTop = idx * ITEM;
  setTimeout(() => { el.scrollTop = idx * ITEM; el.style.scrollSnapType = ""; setTimeout(() => { ready = true; }, 50); }, 60);
  el.addEventListener("scroll", () => {
    if (!ready) return;
    const i = Math.round(el.scrollTop / ITEM);
    if (i !== idx && i >= 0 && i < values.length) { idx = i; mark(i); onChange(values[i]); }
    clearTimeout(t); t = setTimeout(() => { if (Math.abs(el.scrollTop - idx * ITEM) > 2) el.scrollTo({ top: idx * ITEM, behavior: "smooth" }); }, 120);
  }, { passive: true });
  el.addEventListener("keydown", (e) => { if (e.key === "ArrowUp") { e.preventDefault(); set(idx - 1, true); } if (e.key === "ArrowDown") { e.preventDefault(); set(idx + 1, true); } });
  [...el.children].forEach((c, k) => c.addEventListener("click", () => set(k, true)));
  $$(`[data-w="${id}"]`).forEach(b => b.addEventListener("click", () => set(idx + (+b.dataset.d), true)));
  return { set: (v) => set(nearestIdx(values, v), true) };
}

function describe(s) {
  if (s.module === "cardio") return [s.duration_min && s.duration_min + " min", s.distance_km && kg(s.distance_km) + " km", s.kcal && s.kcal + " kcal", s.hr_avg && "♥ " + s.hr_avg].filter(Boolean).join(" · ") || "Foto opgeslagen";
  if (s.exercise === "Dead Hang") return s.seconds + " sec";

/* Tekst van een Matrix-scherm (via Live Text van de iPhone) omzetten naar duur, afstand, kcal, snelheid en helling */
function parseMatrix(text) {
  const t = String(text).toUpperCase().replace(/,/g, ".").replace(/[Oo](?=\d)|(?<=\d)[Oo]/g, "0");
  const n = (re) => { const m = t.match(re); return m ? parseFloat(m[1]) : ""; };
  const r1 = (x) => x === "" ? "" : Math.round(x * 10) / 10;
  const miles = /\bMI\b|MPH|MILE/.test(t);
  let dist = n(/(\d+(?:\.\d+)?)\s*(?:MI|MILES?|KM)\b/);
  let speed = n(/(\d+(?:\.\d+)?)\s*(?:MPH|KM\/?H|KPH)/);
  if (miles) { if (dist !== "") dist = Math.round(dist * 1.609344 * 100) / 100; if (speed !== "") speed = speed * 1.609344; }
  const kcal = n(/(\d+)\s*(?:K?CAL|KCAL|CALORIES)/);
  const incline = n(/(\d+(?:\.\d+)?)\s*%/);
  /* Tijd: de eerste mm:ss of u:mm:ss die geen tempo (per mijl/km) is */
  let dur = "";
  const re = /(\d{1,2}):(\d{2})(?::(\d{2}))?(?!\s*\/)/g; let m;
  while ((m = re.exec(t))) {
    if (/PACE|TEMPO/.test(t.slice(Math.max(0, m.index - 8), m.index))) continue;
    dur = m[3] ? (+m[1]) * 60 + (+m[2]) + (+m[3]) / 60 : (+m[1]) + (+m[2]) / 60; break;
  }
  return { dur: r1(dur), dist, kcal, speed: r1(speed), incline, miles };
}
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", q));
    }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

function suggest(last, values) {

}

  const stopCd = () => { clearInterval(cdTimer); cdTimer = 0; disp.classList.remove("cd"); };
  const stop = () => { stopCd(); cancelAnimationFrame(raf); raf = 0; disp.classList.remove("run"); try { lock && lock.release(); } catch (e) {} lock = null; };
  const run = () => { stopCd(); start = performance.now(); secs = 0; disp.classList.add("run"); btn.textContent = "Stop"; beep(1320, 280); buzz(); tick(); };
  const showCd = () => { disp.innerHTML = `${cd}<small> klaar…</small>`; };
  btn.onclick = async () => {
    if (cdTimer) { stop(); disp.innerHTML = "0<small> sec</small>"; btn.textContent = "Start"; return; }
    if (!raf) {
      $("#tAfter").hidden = true;
      try { lock = await navigator.wakeLock?.request("screen"); } catch (e) {}
      if (!lead) return run();
      cd = lead; disp.classList.add("cd"); btn.textContent = "Annuleer"; showCd(); beep();
      cdTimer = setInterval(() => { cd--; if (cd <= 0) run(); else { showCd(); beep(); } }, 1000);
    } else { stop(); buzz(); beep(660, 200); btn.textContent = "Opnieuw"; $("#tAfter").hidden = false; }

  $("#tDrop").onclick = () => { $("#tAfter").hidden = true; secs = 0; disp.innerHTML = "0<small> sec</small>"; btn.textContent = "Start"; };

AFTER.pullup = () => {
  const p = P();

/* ---------- Data & export ---------- */
const pad = (n) => String(n).padStart(2, "0");
const localDay = (t) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const localTime = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayLabel = (day) => new Date(day + "T12:00").toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const r2 = (n) => Math.round(n * 100) / 100;
const vol = (s) => (s.sets && s.reps && s.weight_kg) ? s.sets * s.reps * s.weight_kg : "";
const isMilestone = (s) => s.source === "mijlpaal";
const isStrength = (s) => !isMilestone(s) && (s.module === "machine" || s.module === "free" || s.kind === "pullup");
const isHold = (s) => s.kind === "hang" || s.kind === "stretch";
const whichProfiles = (which) => Object.keys(PROFILES).filter(p => which === "all" || which === p);
const sessionsOf = (p) => [...state.data[p].sessions].sort((a, b) => a.ts.localeCompare(b.ts));

const COLS = [
  ["datum", s => localDay(s.ts)], ["tijd", s => localTime(s.ts)], ["profiel", s => PROFILES[s.profile] || s.profile],
  ["module", s => MODULES[s.module] || s.module], ["oefening", s => s.exercise], ["sets", s => s.sets], ["herhalingen", s => s.reps], ["gewicht_kg", s => s.weight_kg],
  ["volume_kg", vol], ["seconden", s => s.seconds], ["pullup_stap", s => s.step],
  ["duur_min", s => s.duration_min], ["afstand_km", s => s.distance_km], ["kcal_toestel", s => s.kcal], ["niveau", s => s.level],
  ["watch_actieve_kcal", s => s.watch_active_kcal], ["watch_totaal_kcal", s => s.watch_total_kcal], ["hartslag_gem", s => s.hr_avg], ["hartslag_max", s => s.hr_max],
  ["toestel_instellingen", s => s.settings || [s.setting_seat && "Zithoogte=" + s.setting_seat, s.setting_back && "Rugleuning=" + s.setting_back, s.setting_extra && "Overig=" + s.setting_extra].filter(Boolean).join("; ")],
  ["foto", s => s.photo ? "ja" : ""], ["bron", s => s.source], ["notities", s => s.notes], ["id", s => s.id]
];
function toCSV(which, sep) {
  const rows = whichProfiles(which).flatMap(sessionsOf).sort((a, b) => a.ts.localeCompare(b.ts));
  const cell = (v) => {
    if (v == null) v = "";
    if (typeof v === "number" && sep === ";") v = String(v).replace(".", ",");
    v = String(v);
    return /[",;\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  };
  return [COLS.map(c => c[0]).join(sep), ...rows.map(r => COLS.map(c => cell(c[1](r))).join(sep))].join("\r\n");
}

/* JSON voor AI: per profiel de toestellen en alle sessies, zonder foto's en zonder lege velden. */
function toAIJSON(which) {
  const out = { app: "Cabana Fitness", geexporteerd: new Date().toISOString(), eenheden: { gewicht: "kg", afstand: "km", duur: "min" }, profielen: {} };
  for (const p of whichProfiles(which)) {
    const d = state.data[p];
    out.profielen[PROFILES[p]] = {
      toestellen: d.machines.map(m => ({ naam: m.name, instellingen: Object.fromEntries(Object.entries(m.settings || {}).filter(([, v]) => v)), commentaar: m.comment || undefined })),
      pullup_stap: d.pullupStep,
      sessies: sessionsOf(p).map(s => Object.fromEntries(COLS.filter(([k]) => k !== "profiel" && k !== "foto").map(([k, f]) => [k, f(s)]).filter(([, v]) => v !== "" && v != null)))
    };
  }
  return JSON.stringify(out, null, 1);
}

/* ---------- Obsidian: markdown-tabellen, YAML-properties en [[links]] ---------- */
const mdc = (v) => { const t = String(v ?? "").replace(/\|/g, "\\|").replace(/[\r\n]+/g, " ").trim(); return t || " "; };
const yq = (v) => JSON.stringify(String(v));
const fname = (s) => String(s).replace(/[\\/:*?"<>|#^[\]]/g, "-").replace(/\s+/g, " ").trim();
const exNote = (p, ex) => `${fname(ex)} · ${PROFILES[p]}`;
const table = (head, rows) => rows.length ? [`| ${head.join(" | ")} |`, `|${head.map(() => " --- ").join("|")}|`, ...rows.map(r => `| ${r.map(mdc).join(" | ")} |`)].join("\n") : "";
const byDay = (list) => { const m = new Map(); for (const s of list) { const d = localDay(s.ts); if (!m.has(d)) m.set(d, []); m.get(d).push(s); } return m; };
const setsReps = (s) => (s.sets || s.reps) ? `${s.sets || "?"} × ${s.reps || "?"}` : "";

function dayBody(p, list, h, links) {
  const ex = (s) => links ? `[[${exNote(p, s.exercise)}]]` : s.exercise;
  const str = list.filter(isStrength), car = list.filter(s => s.module === "cardio"), hold = list.filter(isHold), mile = list.filter(isMilestone);
  const out = [];
  if (str.length) out.push(`${h} Kracht`, table(["Tijd", "Oefening", "Sets × herh.", "Gewicht (kg)", "Volume (kg)", "Instellingen", "Notitie"],
    str.map(s => [localTime(s.ts), ex(s), setsReps(s), kg(s.weight_kg), kg(vol(s)), s.settings, s.notes])));
  if (car.length) out.push(`${h} Cardio`, table(["Tijd", "Toestel", "Duur (min)", "Afstand (km)", "Kcal toestel", "Watch actief", "Hartslag gem / max", "Notitie"],
    car.map(s => [localTime(s.ts), ex(s), kg(s.duration_min), kg(s.distance_km), s.kcal, s.watch_active_kcal, [s.hr_avg, s.hr_max].filter(x => x !== "" && x != null).join(" / "), s.notes])));
  if (hold.length) out.push(`${h} Hangen & rekken`, table(["Tijd", "Oefening", "Seconden"], hold.map(s => [localTime(s.ts), ex(s), s.seconds])));
  if (mile.length) out.push(`${h} Mijlpalen`, mile.map(s => `- ${localTime(s.ts)} ${s.exercise}`).join("\n"));
  return out.join("\n\n");
}
function dayStats(list) {
  return { volume: r2(list.filter(isStrength).reduce((a, s) => a + (vol(s) || 0), 0)), cardio: r2(list.filter(s => s.module === "cardio").reduce((a, s) => a + (+s.duration_min || 0), 0)), n: list.filter(s => !isMilestone(s)).length };
}

/* Per oefening: eerste, laatste en beste prestatie. */
function progressRows(p, links) {
  const m = new Map();
  for (const s of sessionsOf(p).filter(s => !isMilestone(s))) { if (!m.has(s.exercise)) m.set(s.exercise, []); m.get(s.exercise).push(s); }
  const val = (s) => s.module === "cardio" ? (s.duration_min !== "" && s.duration_min != null ? kg(s.duration_min) + " min" : describe(s)) : isHold(s) ? s.seconds + " sec" : (s.weight_kg !== "" && s.weight_kg != null ? `${kg(s.weight_kg)} kg · ${setsReps(s)}` : setsReps(s));
  const best = (l) => {
    if (l[0].module === "cardio") { const b = Math.max(...l.map(s => +s.distance_km || 0)); return b ? kg(b) + " km" : ""; }
    if (isHold(l[0])) return Math.max(...l.map(s => +s.seconds || 0)) + " sec";
    const w = Math.max(...l.map(s => +s.weight_kg || 0)); return w ? kg(w) + " kg" : Math.max(...l.map(s => +s.reps || 0)) + " herh.";
  };
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], "nl")).map(([ex, l]) => [links ? `[[${exNote(p, ex)}]]` : ex, MODULES[l[0].module], l.length, `${localDay(l[0].ts)}: ${val(l[0])}`, `${localDay(l[l.length - 1].ts)}: ${val(l[l.length - 1])}`, best(l)]);
}
const PROG_HEAD = ["Oefening", "Module", "Sessies", "Eerste", "Laatste", "Beste"];

/* Eén notitie met alles: handig om te kopiëren en te plakken in Obsidian of een AI-chat. */
function toLogbook(which) {
  const ps = whichProfiles(which), today = localDay(new Date());
  const out = ["---", "type: cabana-logboek", `geexporteerd: ${today}`, `profielen: [${ps.map(p => yq(PROFILES[p])).join(", ")}]`, `tags: [cabana${ps.map(p => ", cabana/" + p).join("")}]`, "---", "", "# Cabana logboek", ""];
  for (const p of ps) {
    const all = sessionsOf(p);
    out.push(`## ${PROFILES[p]}`, "");
    if (!all.length) { out.push("_Nog geen sessies._", ""); continue; }
    out.push("### Progressie per oefening", "", table(PROG_HEAD, progressRows(p, false)), "", "### Dagboek", "");
    for (const [day, list] of [...byDay(all)].reverse()) {
      const st = dayStats(list);
      out.push(`#### ${day} · ${dayLabel(day)}`, "", `${st.n} oefeningen${st.volume ? ` · ${kg(st.volume)} kg volume` : ""}${st.cardio ? ` · ${kg(st.cardio)} min cardio` : ""}`, "", dayBody(p, list, "#####", false), "");
    }
  }
  return out.join("\n").replace(/\n{3,}/g, "\n\n");
}

/* Vault-map: een notitie per trainingsdag en per oefening, met properties voor Dataview en Bases. */
function toVault(which) {
  const files = [], ps = whichProfiles(which), root = "Cabana";
  const ov = ["---", "type: cabana-overzicht", `geexporteerd: ${localDay(new Date())}`, "tags: [cabana]", "---", "", "# Cabana overzicht", ""];
  for (const p of ps) {
    const all = sessionsOf(p), name = PROFILES[p], health = state.data[p].health || {};
    ov.push(`## ${name}`, "", all.length ? table(PROG_HEAD, progressRows(p, true)) : "_Nog geen sessies._", "");
    for (const [day, list] of byDay(all)) {
      const st = dayStats(list), mods = [...new Set(list.map(s => MODULES[s.module]))];
      files.push({ name: `${root}/${name}/Dagen/${day} ${name}.md`, text: ["---", `datum: ${day}`, `profiel: ${name}`, "type: cabana-training", `modules: [${mods.map(yq).join(", ")}]`, `oefeningen: ${st.n}`, `volume_kg: ${st.volume}`, `cardio_min: ${st.cardio}`, ...(health[day] && health[day].sent ? ["apple_gezondheid: true"] : []), `tags: [cabana, cabana/${p}]`, "---", "", `# ${dayLabel(day)} · ${name}`, "", dayBody(p, list, "##", true), ""].join("\n") });
    }
    const m = new Map();
    for (const s of all.filter(s => !isMilestone(s))) { if (!m.has(s.exercise)) m.set(s.exercise, []); m.get(s.exercise).push(s); }
    for (const [ex, l] of m) {
      const f = l[0], lastS = l[l.length - 1], cardio = f.module === "cardio", hold = isHold(f);
      const dayLink = (s) => `[[${localDay(s.ts)} ${name}]]`;
      let rows, head, extra = [];
      if (cardio) { head = ["Datum", "Duur (min)", "Afstand (km)", "Kcal toestel", "Watch actief", "Hartslag gem"]; rows = l.map(s => [dayLink(s), kg(s.duration_min), kg(s.distance_km), s.kcal, s.watch_active_kcal, s.hr_avg]); }
      else if (hold) { head = ["Datum", "Seconden", "Verschil"]; rows = l.map((s, i) => [dayLink(s), s.seconds, i ? diff(s.seconds, l[i - 1].seconds, " sec") : ""]); extra = [`beste_seconden: ${Math.max(...l.map(s => +s.seconds || 0))}`]; }
      else {
        head = ["Datum", "Sets × herh.", "Gewicht (kg)", "Volume (kg)", "Verschil gewicht", "Notitie"];
        rows = l.map((s, i) => [dayLink(s), setsReps(s), kg(s.weight_kg), kg(vol(s)), i ? diff(s.weight_kg, l[i - 1].weight_kg, " kg") : "", s.notes]);
        const w = l.map(s => +s.weight_kg || 0);
        extra = [`start_gewicht_kg: ${w[0]}`, `huidig_gewicht_kg: ${w[w.length - 1]}`, `beste_gewicht_kg: ${Math.max(...w)}`, `max_volume_kg: ${Math.max(...l.map(s => +vol(s) || 0))}`];
      }
      files.push({ name: `${root}/${name}/Oefeningen/${exNote(p, ex)}.md`, text: ["---", `oefening: ${yq(ex)}`, `profiel: ${name}`, `module: ${yq(MODULES[f.module])}`, "type: cabana-oefening", `sessies: ${l.length}`, `eerste: ${localDay(f.ts)}`, `laatste: ${localDay(lastS.ts)}`, ...extra, `tags: [cabana, cabana/${p}]`, "---", "",
        `# ${ex} · ${name}`, "", ...(lastS.settings ? [`> Instellingen: ${lastS.settings}`, ""] : []), "## Progressie", "", table(head, rows), ""].join("\n") });
    }
  }
  ov.push("## Dataview", "", "Met de Dataview-plugin zie je hier alle trainingsdagen:", "", "```dataview", 'TABLE profiel, oefeningen, volume_kg, cardio_min FROM #cabana WHERE type = "cabana-training" SORT datum DESC', "```", "");
  files.unshift({ name: `${root}/Cabana overzicht.md`, text: ov.join("\n") });
  return files;
}
function diff(a, b, unit) {
  if (a === "" || a == null || b === "" || b == null) return "";
  const d = r2(a - b); return d > 0 ? `+${kg(d)}${unit}` : d < 0 ? `${kg(d).replace("-", "−")}${unit}` : "=";
}

/* Minimale zip-schrijver (zonder compressie), zodat de vault-map als één bestand kan. */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (b) => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zip(files) {
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30)), c = new DataView(new ArrayBuffer(46));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(10, time, true); h.setUint16(12, date, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(12, time, true); c.setUint16(14, date, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    parts.push(h, name, data); central.push(c, name);
    off += 30 + name.length + data.length;
  }
  const size = central.reduce((a, x) => a + x.byteLength, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, e], { type: "application/zip" });
}

/* ---------- Apple Gezondheid via de app Opdrachten ----------
   Een website kan niet zelf in HealthKit schrijven. De app geeft de training als JSON door aan de
   opdracht "Cabana naar Gezondheid", die met de actie "Registreer training" een workout vastlegt. */
const SHORTCUT = "Cabana naar Gezondheid";
const healthOf = () => (P().health = P().health || {});
const healthList = (day) => P().sessions.filter(s => localDay(s.ts) === day && s.module !== "cardio" && !isMilestone(s)).sort((a, b) => a.ts.localeCompare(b.ts));
function healthDraft(day) {
  const list = healthList(day); if (!list.length) return null;
  const saved = healthOf()[day] || {};
  const start = new Date(new Date(list[0].ts).getTime() - 10 * 60000), end = new Date(list[list.length - 1].ts);
  const min = saved.min || Math.max(15, Math.round((end - start) / 60000));
  return { day, list, start: saved.start || localTime(start), min, kcal: saved.kcal != null && saved.kcal !== "" ? saved.kcal : Math.round(min * 5), sent: saved.sent || "" };
}
function healthPayload(dr) {
  const st = dayStats(dr.list);
  /* Gezondheid weigert een training die in de toekomst eindigt: schuif de start terug zodat het einde uiterlijk nu is */
  let start = `${dr.day} ${dr.start}`;
  const end = new Date(`${dr.day}T${dr.start}:00`).getTime() + (+dr.min) * 60000, now = Date.now() - 60000;
  if (end > now) { const d = new Date(now - (+dr.min) * 60000); start = `${localDay(d.toISOString())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  return { app: "Cabana Fitness", profiel: PROFILES[state.profile], type: "Krachttraining", start, minuten: +dr.min, kcal: +dr.kcal || 0,
    oefeningen: st.n, volume_kg: st.volume, samenvatting: dr.list.map(s => `${s.exercise}: ${describe(s)}`).join("\n") };
}
function sendToHealth(dr) {
  healthOf()[dr.day] = { start: dr.start, min: dr.min, kcal: dr.kcal, sent: new Date().toISOString() }; save();
  const url = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT)}&input=text&text=${encodeURIComponent(JSON.stringify(healthPayload(dr)))}`;
  try { (window.top || window).location.href = url; } catch (e) { try { location.href = url; } catch (e2) {} }
  toast("Opdrachten opent. Gebeurt er niets? Zet de app op je beginscherm.");
}
const healthDays = () => [...new Set(P().sessions.filter(s => s.module !== "cardio" && !isMilestone(s)).map(s => localDay(s.ts)))].sort().reverse();

  <section class="card">
    ${days.length > 1 ? `<div class="chips">${days.slice(0, 6).map(d => `<button class="chip" data-day="${d}" aria-pressed="${d === day}">${d === localDay(new Date()) ? "Vandaag" : new Date(d + "T12:00").toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" })}</button>`).join("")}</div>` : ""}

    <div class="hist">${dr.list.map(s => `<div><span class="l"><b>${esc(s.exercise)}</b><span>${localTime(s.ts)} · ${esc(describe(s))}</span></span></div>`).join("")}</div>

function progState() {
  const p = P();
  if (!p.prog) p.prog = { id: "", week: 0, day: {}, tm: {} };
  p.prog.day = p.prog.day || {}; p.prog.tm = p.prog.tm || {};
  return p.prog;
}
const machineByKey = (key) => P().machines.find(m => m.key === key);
const exKey = (x) => x.m + (x.sub ? "|" + x.sub : "");
const exName = (x) => { const d = CATALOG.find(c => c.key === x.m); return x.sub ? `${x.sub}` : d.name; };
const stackVals = (it) => STACKS[stackOf(it)].values || WEIGHTS;
const snap = (it, w) => { const v = stackVals(it); return v[nearestIdx(v, w)]; };
/* Trainingsmax (TM) = 90% van je geschatte 1RM (Epley) uit je beste set van de laatste 20 logs op dat toestel. */
function trainingMax(x) {
  const it = machineByKey(x.m); if (!it) return { tm: null };
  const own = progState().tm[exKey(x)];
  if (own) return { tm: own, own: true, it };
  const hist = machineSessions(it, x.sub || "").filter(s => +s.weight_kg > 0 && +s.reps > 0).slice(0, 20);
  if (!hist.length) return { tm: null, it };
  const best = Math.max(...hist.map(s => s.weight_kg * (1 + Math.min(s.reps, 12) / 30)));
  return { tm: snap(it, best * 0.9), it };
}
/* Werkgewicht voor hulpoefeningen: zelfde regel als het toestelscherm (laatste keer, of één plaatje zwaarder na 15 herhalingen). */
function workWeight(x) {
  const it = machineByKey(x.m); if (!it) return null;
  const last = machineSessions(it, x.sub || "")[0];
  return last ? suggest(last, STACKS[stackOf(it)].values).weight : null;
}
const today = () => localDay(new Date());
const doneToday = (tag) => P().sessions.some(s => s.prog === tag && localDay(s.ts) === today());

VIEWS.program = () => {
  const pr = PROGRAMS.find(p => p.id === route.pid); if (!pr) return VIEWS.programs();
  const ps = progState();
  const di = Math.min(route.day ?? ps.day[pr.id] ?? 0, pr.days.length - 1);
  const day = pr.days[di];
  const wk = ps.week || 0;
  const back = { pid: pr.id, day: di };
  const tagBase = `${pr.id}|w${pr.wave ? wk + 1 : 0}|${day.name}`;
  const label = `${pr.short}${pr.wave ? " week " + (wk + 1) : ""} · ${day.name}`;
  const logBtn = (x, sets, reps, w, tag) => {
    const done = doneToday(tag);
    const arg = esc(JSON.stringify({ m: x.m, sub: x.sub || "", sets, reps, w, tag, label, back }));
    return `<button class="logbtn${done ? " done" : ""}" data-log="${arg}">${done ? "✓ Gedaan" : "Log"}</button>`;
  };
  const photo = (x) => { const d = CATALOG.find(c => c.key === x.m); return `<button class="ph" data-zoom="${x.m}" aria-label="Foto ${esc(d.name)} groot"><img src="img/${d.img}.jpg" alt="" loading="lazy"><span aria-hidden="true">⤢</span></button>`; };
  const settingsTxt = (x) => { const it = machineByKey(x.m); const s = Object.entries((it && it.settings) || {}).filter(([, v]) => v).map(([k, v]) => `${k} ${v}`).join(" · "); return s ? esc(s) : "Instellingen: tik op de foto voor de stappen"; };
  const head = (x, role) => { const d = CATALOG.find(c => c.key === x.m); return `<span class="role">${role}</span><h4>${esc(exName(x))}</h4><p class="set-info">${x.sub ? esc(d.name) + " · " : ""}${settingsTxt(x)}</p>`; };

  let body = "";
  if (pr.wave) {
    const x = day.main, { tm, own, it } = trainingMax(x);
    const W = WAVE[wk];
    const kgOf = (pct) => tm ? snap(it, tm * pct / 100) : null;
    const lines = W.sets.map(([pct, reps, amrap], i) => {
      const w = kgOf(pct);
      return `<div class="setline"><span><b>${reps}${amrap ? "+" : ""} @ ${w != null ? kg(w) + " kg" : pct + "%"}</b><small>Set ${i + 1} · ${pct}% van TM${amrap ? " · zoveel als lukt" : ""}</small></span>${logBtn(x, 1, reps, w, `${tagBase}|main${i}`)}</div>`;
    }).join("");
    const bbbW = kgOf(50);
    const bbb = wk === 3 ? `<p class="set-info" style="margin:8px 0 0">Deload-week: geen 5 × 10, alleen de drie lichte sets.</p>`
      : `<div class="setline"><span><b>5 × 10 @ ${bbbW != null ? kg(bbbW) + " kg" : "50%"}</b><small>Boring But Big · 50% van TM</small></span>${logBtn(x, 5, 10, bbbW, `${tagBase}|bbb`)}</div>`;
    const tmRow = `<div class="tm">Trainingsmax <b>${tm ? kg(tm) + " kg" : "nog onbekend"}</b>${tm ? (own ? " · zelf ingesteld" : " · uit je logs") : ""}
      <button data-tm="-1" data-x="${esc(exKey(x))}" aria-label="Trainingsmax lager">−</button><button data-tm="1" data-x="${esc(exKey(x))}" aria-label="Trainingsmax hoger">+</button>${own ? `<button class="reset" data-tm="0" data-x="${esc(exKey(x))}">Uit logs</button>` : ""}</div>`;
    body += `<div class="exrow">${photo(x)}<div>${head(x, "Hoofdtoestel")}${tm ? "" : `<p class="hint" style="margin:4px 0 6px;font-size:14px">Log eerst één keer ${esc(exName(x))} (bijv. 3 × 8), dan rekent de app je gewichten uit. Of stel de trainingsmax zelf in met + en −.</p>`}${tmRow}${lines}${bbb}</div></div>`;
  }
  body += (day.acc || day.ex).map((x, i) => {
    const w = workWeight(x);
    return `<div class="exrow">${photo(x)}<div>${head(x, pr.wave ? "Hulpoefening" : "Oefening " + (i + 1))}
      <div class="setline"><span><b>${x.sets} × ${x.reps}${w != null ? " @ " + kg(w) + " kg" : ""}</b><small>${w != null ? "Op basis van je laatste keer" : "Eerste keer: kies je startgewicht"}</small></span>${logBtn(x, x.sets, x.reps, w, `${tagBase}|x${i}`)}</div>
    </div></div>`;
  }).join("");

  return `${backBtn("programs", "Trainingsprogramma's")}
  <div class="head"><h1>${esc(pr.name)}</h1><p>${esc(pr.tag)}</p></div>
  <details class="card plate how"><summary><span><b>Uitleg</b><span class="muted small">${esc(pr.intro.split(". ")[0])}.</span></span></summary>
    <p class="small" style="margin:0">${esc(pr.intro)}</p>
    ${pr.wave ? `<table class="wave"><tr><th>Week</th><th>Set 1</th><th>Set 2</th><th>Set 3</th></tr>${WAVE.map((w, i) => `<tr class="${i === wk ? "cur" : ""}"><td>${w.name}</td>${w.sets.map(([p, r, a]) => `<td>${r}${a ? "+" : ""} @ ${p}%</td>`).join("")}</tr>`).join("")}</table>` : ""}
  </details>
  ${pr.wave ? `<div class="tabs" role="group" aria-label="Week">${WAVE.map((w, i) => `<button class="chip" data-week="${i}" aria-pressed="${i === wk}">${w.name} · ${w.short}</button>`).join("")}</div>` : ""}
  <div class="tabs" role="group" aria-label="Dag">${pr.days.map((d, i) => `<button class="chip" data-day="${i}" aria-pressed="${i === di}">${pr.wave ? "Dag " + (i + 1) + " · " : ""}${esc(d.name)}</button>`).join("")}</div>
  <section class="card"><p class="eyebrow">${esc(label)}</p>${body}</section>
  ${ps.id === pr.id ? `<p class="small muted" style="margin:0;text-align:center">Dit is jouw actieve schema; het staat op de tegel in het dashboard.</p>` : `<button class="btn primary big" id="progUse">Maak dit mijn schema</button>`}`;
};
AFTER.program = () => {
  const pr = PROGRAMS.find(p => p.id === route.pid); if (!pr) return;
  const ps = progState();
  const di = Math.min(route.day ?? ps.day[pr.id] ?? 0, pr.days.length - 1);
  $$("[data-week]").forEach(b => b.onclick = () => { ps.week = +b.dataset.week; save(); buzz(); go("program", { pid: pr.id, day: di }); });
  $$("[data-day]").forEach(b => b.onclick = () => { ps.day[pr.id] = +b.dataset.day; save(); buzz(); go("program", { pid: pr.id, day: +b.dataset.day }); });
  $$("[data-tm]").forEach(b => b.onclick = () => {
    const k = b.dataset.x, [m, sub] = k.split("|"), x = { m, sub }, d = +b.dataset.tm;
    if (!d) delete ps.tm[k];
    else { const { tm, it } = trainingMax(x); if (!it) return; const v = stackVals(it); const i = tm ? nearestIdx(v, tm) + d : 5; ps.tm[k] = v[Math.max(0, Math.min(v.length - 1, i))]; }
    save(); buzz(); go("program", { pid: pr.id, day: di });
  });
  $$("[data-log]").forEach(b => b.onclick = () => {
    const a = JSON.parse(b.dataset.log), it = machineByKey(a.m);
    if (!it) return toast("Dit toestel staat niet meer in je lijst");
    if (a.sub) subPick[it.id] = a.sub;
    buzz(); go("strength", { id: it.id, preset: { sets: a.sets, reps: a.reps, weight: a.w }, prog: { tag: a.tag, label: a.label }, back: Object.assign({ view: "program" }, a.back) });
  });
  const u = $("#progUse"); if (u) u.onclick = () => { ps.id = pr.id; save(); buzz(); toast(`${pr.name} is nu jouw schema`); go("program", { pid: pr.id, day: di }); };
};

/* ---------- Globale events ---------- */
/* Tik-feedback op de glazen tegels: indrukken, lichtgolf vanaf je vinger, korte trilling, dan pas door */
const unpress = () => $$(".tile.pressed").forEach(t => t.classList.remove("pressed"));
document.addEventListener("pointerdown", (e) => {
  const t = e.target.closest(".tile"); if (!t) return;
  t.classList.add("pressed");
  const r = t.getBoundingClientRect(), w = document.createElement("span");
  w.className = "ripple"; w.style.left = (e.clientX - r.left) + "px"; w.style.top = (e.clientY - r.top) + "px";
  t.appendChild(w); setTimeout(() => w.remove(), 650);
}, { passive: true });
["pointerup", "pointercancel", "scroll"].forEach(ev => document.addEventListener(ev, () => setTimeout(unpress, 90), { passive: true, capture: true }));
let leaving = false;
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]");
  if (g && g.classList.contains("tile")) {
    if (leaving) return; leaving = true; buzz(); g.classList.add("pressed");
    setTimeout(() => { leaving = false; go(g.dataset.go, g.dataset.arg ? JSON.parse(g.dataset.arg) : {}); }, 170); return;
  }
  if (g) { go(g.dataset.go, g.dataset.arg ? JSON.parse(g.dataset.arg) : {}); return; }
  const z = e.target.closest("[data-zoom]");
  if (z) { buzz(); zoom(z.dataset.zoom); return; }
  const d = e.target.closest("[data-del]");
  if (d) {
    const row = d.parentElement;
    if (d.dataset.armed) { P().sessions = P().sessions.filter(s => s.id !== d.dataset.del); save(); toast("Verwijderd"); render(); }
    else { d.dataset.armed = "1"; d.textContent = "?"; d.style.color = "var(--danger)"; d.style.borderColor = "var(--danger)"; d.setAttribute("aria-label", "Tik nogmaals om te verwijderen"); toast("Tik nogmaals om te verwijderen"); }
  }
});
$$(".seg button").forEach(b => b.onclick = () => { state.profile = b.dataset.p; save(); buzz(); go(route.view === "strength" || route.view === "cardioLog" ? "home" : route.view, route); });
$("#homeBtn").onclick = () => go("home");
$("#dataBtn").onclick = () => go("data");

render();
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude|anthropic|usercontent/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  /* Nieuwe versie online? Bij terugkeer naar de app zelf herladen, zodat afsluiten niet nodig is. Houd gelijk aan CACHE in sw.js. */
  const APP_VERSION = "cabana-v17";
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || $(".lightbox") || ["Stop", "Annuleer"].includes($("#tBtn")?.textContent)) return;
    fetch("sw.js", { cache: "no-store" }).then(r => r.text()).then(t => { const m = t.match(/cabana-v\d+/); if (m && m[0] !== APP_VERSION) location.reload(); }).catch(() => {});
  });
}
})();
</script>
</body>
</html>
